<!-- AUTO-GENERISANO - NE MENJATI RUČNO -->
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Radnik - nov unos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1 id="naslov">Novi Radnik</h1>
<div class="nav"><a href="list_radnik.html">&larr; Nazad na listu</a></div>
<form id="f">
  <label>Ime
    <input name="ime" type="text">
  </label>
  <label>Prezime
    <input name="prezime" type="text">
  </label>
  <label>Radno vreme do
    <input name="radnoVremeDo" type="time">
  </label>
  <label>Radno vreme od
    <input name="radnoVremeOd" type="time">
  </label>
  <fieldset class="checkbox-group" data-m2m-source="usluga" data-m2m-display="naziv" data-m2m-role="usluga">
    <legend>Usluga (izaberi jednu ili više)</legend>
    <div class="checkbox-group-items">- učitavanje -</div>
  </fieldset>
  <button type="submit">Sačuvaj</button>
</form>
<pre id="out"></pre>
</div>
<script>
const params = new URLSearchParams(location.search);
const editId = params.get("id");
if (editId) {
  document.title = "Radnik - izmena";
  document.getElementById("naslov").textContent = "Izmeni Radnik";
  document.querySelector('button[type="submit"]').textContent = "Sačuvaj izmene";
}

function popuniIzbor(url, render) {
  return fetch(url).then(r => r.json()).then(render);
}

const opcijeUcitane = [
  popuniIzbor("http://127.0.0.1:8000/usluga/", rows => {
    const wrap = document.querySelector('fieldset[data-m2m-role="usluga"] .checkbox-group-items');
    wrap.innerHTML = rows.length
      ? rows.map(o => `<label><input type="checkbox" name="usluga_ids" value="${o.id}"> ${o.naziv ?? ("#" + o.id)}</label>`).join("")
      : '<span class="muted">Nema unosa u usluga.</span>';
  }),
];

if (editId) {
  Promise.all(opcijeUcitane).then(() => {
    fetch(`http://127.0.0.1:8000/radnik/${editId}`)
      .then(r => r.json())
      .then(rec => {
        document.querySelector('[name="ime"]').value = rec.ime ?? "";
        document.querySelector('[name="prezime"]').value = rec.prezime ?? "";
        document.querySelector('[name="radnoVremeDo"]').value = rec.radnoVremeDo ?? "";
        document.querySelector('[name="radnoVremeOd"]').value = rec.radnoVremeOd ?? "";
        const izabrano_usluga = new Set((rec.usluga || []).map(o => o.id));
        document.querySelectorAll('input[name="usluga_ids"]').forEach(cb => {
          cb.checked = izabrano_usluga.has(parseInt(cb.value, 10));
        });
      });
  });
}

document.getElementById("f").addEventListener("submit", function(e) {
  e.preventDefault();
  const payload = {};
  payload["ime"] = document.querySelector('[name="ime"]').value;
  payload["prezime"] = document.querySelector('[name="prezime"]').value;
  payload["radnoVremeDo"] = document.querySelector('[name="radnoVremeDo"]').value;
  payload["radnoVremeOd"] = document.querySelector('[name="radnoVremeOd"]').value;
  payload["usluga_ids"] = Array.from(document.querySelectorAll('input[name="usluga_ids"]:checked')).map(el => parseInt(el.value, 10));

  const out = document.getElementById("out");
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  out.classList.remove("error");
  out.textContent = "Čuvanje...";

  const url = editId
    ? `http://127.0.0.1:8000/radnik/${editId}`
    : "http://127.0.0.1:8000/radnik/";

  fetch(url, {
    method: editId ? "PUT" : "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  })
  .then(async r => {
    const data = await r.json();
    if (!r.ok) throw data;
    return data;
  })
  .then(() => {
    out.textContent = "Sačuvano. Preusmeravanje na listu...";
    setTimeout(() => { window.location.href = "list_radnik.html"; }, 500);
  })
  .catch(err => {
    out.classList.add("error");
    out.textContent = "Greška: " + (err && err.detail ? JSON.stringify(err.detail) : JSON.stringify(err));
    btn.disabled = false;
  });
});
</script>
</body>
</html>
