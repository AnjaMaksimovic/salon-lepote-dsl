<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Termin - nov unos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1 id="naslov">Novi Termin</h1>
<div class="nav"><a href="list_termin.html">&larr; Nazad na listu</a></div>
<form id="f">
  <label>Datum vreme
    <input name="datumVreme" type="datetime-local">
  </label>
  <label>Status
    <select name="status">
      <option value="ODRZAN">ODRZAN</option>
      <option value="OTKAZAN">OTKAZAN</option>
      <option value="ZAKAZAN">ZAKAZAN</option>
    </select>
  </label>
  <label>Trajanje min
    <input name="trajanjeMin" type="number">
  </label>
  <label>Klijent
    <select name="klijent_id" data-fk-source="klijent" data-fk-display="ime">
      <option value="">- učitavanje -</option>
    </select>
  </label>
  <label>Radnik
    <select name="radnik_id" data-fk-source="radnik" data-fk-display="ime">
      <option value="">- učitavanje -</option>
    </select>
  </label>
  <fieldset class="checkbox-group" data-m2m-source="usluga" data-m2m-display="naziv" data-m2m-role="usluga">
    <legend>Usluga (izaberi jednu ili više)</legend>
    <div class="checkbox-group-items">- učitavanje -</div>
  </fieldset>
  <button type="submit">Sačuvaj</button>
</form>
<pre id="out"></pre>
</div>
<script>
const params = new URLSearchParams(location.search);
const editId = params.get("id");
if (editId) {
  document.title = "Termin - izmena";
  document.getElementById("naslov").textContent = "Izmeni Termin";
  document.querySelector('button[type="submit"]').textContent = "Sačuvaj izmene";
}

function popuniIzbor(url, render) {
  return fetch(url).then(r => r.json()).then(render);
}

const opcijeUcitane = [
  popuniIzbor("http://127.0.0.1:8000/klijent/", rows => {
    const sel = document.querySelector('select[name="klijent_id"]');
    sel.innerHTML = rows.length
      ? rows.map(o => `<option value="${o.id}">${o.ime ?? ("#" + o.id)}</option>`).join("")
      : '<option value="">- nema unosa, dodajte prvo klijent -</option>';
  }),
  popuniIzbor("http://127.0.0.1:8000/radnik/", rows => {
    const sel = document.querySelector('select[name="radnik_id"]');
    sel.innerHTML = rows.length
      ? rows.map(o => `<option value="${o.id}">${o.ime ?? ("#" + o.id)}</option>`).join("")
      : '<option value="">- nema unosa, dodajte prvo radnik -</option>';
  }),
  popuniIzbor("http://127.0.0.1:8000/usluga/", rows => {
    const wrap = document.querySelector('fieldset[data-m2m-role="usluga"] .checkbox-group-items');
    wrap.innerHTML = rows.length
      ? rows.map(o => `<label><input type="checkbox" name="usluga_ids" value="${o.id}"> ${o.naziv ?? ("#" + o.id)}</label>`).join("")
      : '<span class="muted">Nema unosa u usluga.</span>';
  }),
];

if (editId) {
  Promise.all(opcijeUcitane).then(() => {
    fetch(`http://127.0.0.1:8000/termin/${editId}`)
      .then(r => r.json())
      .then(rec => {
        document.querySelector('[name="datumVreme"]').value = rec.datumVreme ?? "";
        document.querySelector('[name="status"]').value = rec.status ?? "";
        document.querySelector('[name="trajanjeMin"]').value = rec.trajanjeMin ?? "";
        document.querySelector('select[name="klijent_id"]').value = rec.klijent_id;
        document.querySelector('select[name="radnik_id"]').value = rec.radnik_id;
        const izabrano_usluga = new Set((rec.usluga || []).map(o => o.id));
        document.querySelectorAll('input[name="usluga_ids"]').forEach(cb => {
          cb.checked = izabrano_usluga.has(parseInt(cb.value, 10));
        });
      });
  });
}

document.getElementById("f").addEventListener("submit", function(e) {
  e.preventDefault();
  const payload = {};
  payload["datumVreme"] = document.querySelector('[name="datumVreme"]').value;
  payload["status"] = document.querySelector('[name="status"]').value;
  payload["trajanjeMin"] = parseInt(document.querySelector('[name="trajanjeMin"]').value, 10);
  payload["klijent_id"] = parseInt(document.querySelector('[name="klijent_id"]').value, 10);
  payload["radnik_id"] = parseInt(document.querySelector('[name="radnik_id"]').value, 10);
  payload["usluga_ids"] = Array.from(document.querySelectorAll('input[name="usluga_ids"]:checked')).map(el => parseInt(el.value, 10));

  const out = document.getElementById("out");
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  out.classList.remove("error");
  out.textContent = "Čuvanje...";

  const url = editId
    ? `http://127.0.0.1:8000/termin/${editId}`
    : "http://127.0.0.1:8000/termin/";

  fetch(url, {
    method: editId ? "PUT" : "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  })
  .then(async r => {
    const data = await r.json();
    if (!r.ok) throw data;
    return data;
  })
  .then(() => {
    out.textContent = "Sačuvano. Preusmeravanje na listu...";
    setTimeout(() => { window.location.href = "list_termin.html"; }, 500);
  })
  .catch(err => {
    out.classList.add("error");
    out.textContent = "Greška: " + (err && err.detail ? JSON.stringify(err.detail) : JSON.stringify(err));
    btn.disabled = false;
  });
});
</script>
</body>
</html>
