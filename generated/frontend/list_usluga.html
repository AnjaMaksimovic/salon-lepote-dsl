<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Usluga - lista</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1>Usluga</h1>
<div class="nav">
  <a href="index.html">&larr; Početna</a><span class="sep">|</span><a href="form_usluga.html">+ Novi Usluga</a>
</div>
<table id="tbl">
<thead><tr>
  <th>id</th>
  <th>Cena</th>
  <th>Kategorija</th>
  <th>Naziv</th>
  <th>Trajanje min</th>
  <th>Paket</th>
  <th>Radnik</th>
  <th>Termin</th>
  <th></th>
</tr></thead>
<tbody></tbody>
</table>
</div>
<script>
function ucitajFkLookupe() {
  return Promise.all([
  ]);
}
const fkLookupi = {};

function ucitaj() {
  ucitajFkLookupe().then(() => {
    fetch("http://127.0.0.1:8000/usluga/")
      .then(r => r.json())
      .then(rows => {
        const tbody = document.querySelector("#tbl tbody");
        tbody.innerHTML = "";
        if (rows.length === 0) {
          const colCount = document.querySelectorAll("#tbl thead th").length;
          tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; color:var(--muted); padding:1.5rem;">
            Nema unosa. <a href="form_usluga.html">Dodajte prvi.</a></td></tr>`;
          return;
        }
        rows.forEach(row => {
          const tr = document.createElement("tr");
          let html = `<td>${row.id}</td>`;
          html += `<td>${row.cena ?? ""}</td>`;
          html += `<td>${row.kategorija ?? ""}</td>`;
          html += `<td>${row.naziv ?? ""}</td>`;
          html += `<td>${row.trajanjeMin ?? ""}</td>`;
          html += `<td>${(row.paket || []).map(o => o.naziv).join(", ")}</td>`;
          html += `<td>${(row.radnik || []).map(o => o.ime).join(", ")}</td>`;
          html += `<td>${(row.termin || []).map(o => o.id).join(", ")}</td>`;
          html += `<td><a class="edit" href="form_usluga.html?id=${row.id}">izmeni</a><button class="del" data-id="${row.id}">obriši</button></td>`;
          tr.innerHTML = html;
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll("button.del").forEach(btn => {
          btn.addEventListener("click", () => {
            fetch(`http://127.0.0.1:8000/usluga/${btn.dataset.id}`, { method: "DELETE" })
              .then(() => ucitaj());
          });
        });
      });
  });
}
ucitaj();
</script>
</body>
</html>
