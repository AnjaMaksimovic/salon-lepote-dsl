<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client - List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1>Client</h1>
<div class="nav">
  <a href="index.html">&larr; Home</a><span class="sep">|</span><a href="form_client.html">+ New Client</a>
</div>
<p id="error" role="alert"></p>
<table id="tbl">
<thead><tr>
  <th>id</th>
  <th>Email</th>
  <th>Name</th>
  <th>Phone</th>
  <th></th>
</tr></thead>
<tbody></tbody>
</table>
</div>
<script>
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}
async function requestJson(url, options) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail));
  return data;
}
function loadReferenceOptions() {
  return Promise.all([
  ]);
}
const referenceOptions = {};

function loadRecords() {
  loadReferenceOptions().then(() => {
    return requestJson("/client/")
      .then(rows => {
        const tbody = document.querySelector("#tbl tbody");
        tbody.innerHTML = "";
        if (rows.length === 0) {
          const colCount = document.querySelectorAll("#tbl thead th").length;
          tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; color:var(--muted); padding:1.5rem;">
            No records yet. <a href="form_client.html">Add the first record.</a></td></tr>`;
          return;
        }
        rows.forEach(row => {
          const tr = document.createElement("tr");
          let html = `<td>${row.id}</td>`;
          html += `<td>${escapeHtml(row.email)}</td>`;
          html += `<td>${escapeHtml(row.name)}</td>`;
          html += `<td>${escapeHtml(row.phone)}</td>`;
          html += `<td><a class="edit" href="form_client.html?id=${row.id}">edit</a><button class="del" data-id="${row.id}">delete</button></td>`;
          tr.innerHTML = html;
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll("button.del").forEach(btn => {
          btn.addEventListener("click", () => {
            requestJson(`/client/${btn.dataset.id}`, { method: "DELETE" })
              .then(() => loadRecords())
              .catch(err => { document.getElementById("error").textContent = err.message; });
          });
        });
      });
  }).catch(err => { document.getElementById("error").textContent = err.message; });
}
loadRecords();
</script>
</body>
</html>
