<!-- Generated from the domain model. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Service - New record</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1 id="naslov">New Service</h1>
<div class="nav"><a href="list_service.html">&larr; Back to list</a></div>
<form id="f">
  <label>Price
    <input name="price" type="number" step="any">
  </label>
  <label>Category
    <select name="category">
      <option value="HAIR_REMOVAL">HAIR_REMOVAL</option>
      <option value="HAIRCUT">HAIRCUT</option>
      <option value="LASH_BROW">LASH_BROW</option>
      <option value="MANICURE_PEDICURE">MANICURE_PEDICURE</option>
      <option value="FACIAL_CARE">FACIAL_CARE</option>
    </select>
  </label>
  <label>Name
    <input name="name" type="text">
  </label>
  <label>Duration minutes
    <input name="durationMinutes" type="number">
  </label>
  <fieldset class="checkbox-group" data-m2m-source="package" data-m2m-display="name" data-m2m-role="package">
    <legend>Package (select one or more)</legend>
    <div class="checkbox-group-items">- loading -</div>
  </fieldset>
  <fieldset class="checkbox-group" data-m2m-source="worker" data-m2m-display="name" data-m2m-role="worker">
    <legend>Worker (select one or more)</legend>
    <div class="checkbox-group-items">- loading -</div>
  </fieldset>
  <fieldset class="checkbox-group" data-m2m-source="appointment" data-m2m-display="id" data-m2m-role="appointment">
    <legend>Appointment (select one or more)</legend>
    <div class="checkbox-group-items">- loading -</div>
  </fieldset>
  <button type="submit">Save</button>
</form>
<pre id="out"></pre>
</div>
<script>
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}
async function requestJson(url, options) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail));
  return data;
}
// Keep scrolling from changing numeric values accidentally.
document.querySelectorAll('input[type="number"]').forEach(input => {
  input.addEventListener('wheel', event => {
    if (document.activeElement === input) event.preventDefault();
  }, { passive: false });
});

const params = new URLSearchParams(location.search);
const editId = params.get("id");
if (editId) {
  document.title = "Service - Edit";
  document.getElementById("naslov").textContent = "Edit Service";
  document.querySelector('button[type="submit"]').textContent = "Save changes";
}

function populateOptions(url, render) {
  return requestJson(url).then(render);
}

const optionsLoaded = [
  populateOptions("/package/", rows => {
    const wrap = document.querySelector('fieldset[data-m2m-role="package"] .checkbox-group-items');
    wrap.innerHTML = rows.length
      ? rows.map(o => `<label><input type="checkbox" name="package_ids" value="${o.id}"> ${escapeHtml(o.name ?? ("#" + o.id))}</label>`).join("")
      : '<span class="muted">No package records available.</span>';
  }),
  populateOptions("/worker/", rows => {
    const wrap = document.querySelector('fieldset[data-m2m-role="worker"] .checkbox-group-items');
    wrap.innerHTML = rows.length
      ? rows.map(o => `<label><input type="checkbox" name="worker_ids" value="${o.id}"> ${escapeHtml(o.name ?? ("#" + o.id))}</label>`).join("")
      : '<span class="muted">No worker records available.</span>';
  }),
  populateOptions("/appointment/", rows => {
    const wrap = document.querySelector('fieldset[data-m2m-role="appointment"] .checkbox-group-items');
    wrap.innerHTML = rows.length
      ? rows.map(o => `<label><input type="checkbox" name="appointment_ids" value="${o.id}"> ${escapeHtml(o.id ?? ("#" + o.id))}</label>`).join("")
      : '<span class="muted">No appointment records available.</span>';
  }),
];

if (editId) {
  Promise.all(optionsLoaded).then(() => {
    return requestJson(`/service/${editId}`)
      .then(rec => {
        document.querySelector('[name="price"]').value = rec.price ?? "";
        document.querySelector('[name="category"]').value = rec.category ?? "";
        document.querySelector('[name="name"]').value = rec.name ?? "";
        document.querySelector('[name="durationMinutes"]').value = rec.durationMinutes ?? "";
        const selected_package = new Set((rec.package || []).map(o => o.id));
        document.querySelectorAll('input[name="package_ids"]').forEach(cb => {
          cb.checked = selected_package.has(parseInt(cb.value, 10));
        });
        const selected_worker = new Set((rec.worker || []).map(o => o.id));
        document.querySelectorAll('input[name="worker_ids"]').forEach(cb => {
          cb.checked = selected_worker.has(parseInt(cb.value, 10));
        });
        const selected_appointment = new Set((rec.appointment || []).map(o => o.id));
        document.querySelectorAll('input[name="appointment_ids"]').forEach(cb => {
          cb.checked = selected_appointment.has(parseInt(cb.value, 10));
        });
      });
  }).catch(err => { document.getElementById("out").textContent = err.message; });
}
Promise.all(optionsLoaded).catch(err => { document.getElementById("out").textContent = err.message; });

document.getElementById("f").addEventListener("submit", function(e) {
  e.preventDefault();
  const payload = {};
  payload["price"] = parseFloat(document.querySelector('[name="price"]').value);
  payload["category"] = document.querySelector('[name="category"]').value;
  payload["name"] = document.querySelector('[name="name"]').value;
  payload["durationMinutes"] = parseInt(document.querySelector('[name="durationMinutes"]').value, 10);
  payload["package_ids"] = Array.from(document.querySelectorAll('input[name="package_ids"]:checked')).map(el => parseInt(el.value, 10));
  payload["worker_ids"] = Array.from(document.querySelectorAll('input[name="worker_ids"]:checked')).map(el => parseInt(el.value, 10));
  payload["appointment_ids"] = Array.from(document.querySelectorAll('input[name="appointment_ids"]:checked')).map(el => parseInt(el.value, 10));

  const out = document.getElementById("out");
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  out.classList.remove("error");
  out.textContent = "Saving...";

  const url = editId
    ? `/service/${editId}`
    : "/service/";

  fetch(url, {
    method: editId ? "PUT" : "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  })
  .then(async r => {
    const data = await r.json();
    if (!r.ok) throw data;
    return data;
  })
  .then(() => {
    out.textContent = "Saved. Returning to the list...";
    setTimeout(() => { window.location.href = "list_service.html"; }, 500);
  })
  .catch(err => {
    out.classList.add("error");
    out.textContent = "Error: " + (err && err.detail ? JSON.stringify(err.detail) : (err.message || JSON.stringify(err)));
    btn.disabled = false;
  });
});
</script>
</body>
</html>
